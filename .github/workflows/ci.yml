name: WaveVortexModel CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 2'
  workflow_dispatch:
    inputs:
      complete:
        description: Run all focused groups, including longer continuation qualification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wvm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Select CI coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selection_id: ${{ steps.artifact-upload.outputs.artifact-id || steps.artifact-retry.outputs.artifact-id }}
      cpp: ${{ steps.select.outputs.cpp }}
      documentation: ${{ steps.select.outputs.documentation }}
      analyzer: ${{ steps.select.outputs.analyzer }}
      packaging: ${{ steps.select.outputs.packaging }}
      migration: ${{ steps.select.outputs.migration }}
      matlab_matrix: ${{ steps.select.outputs.matlab_matrix }}
      sanitized_matrix: ${{ steps.select.outputs.sanitized_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve changed paths and dependency coverage
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPLETE: ${{ github.event_name == 'schedule' || inputs.complete || contains(github.event.pull_request.labels.*.name, 'final-integration') }}
          LEGACY_CHECKS: 'false' # Disposable proof of the post-migration configuration only.
        run: |
          args=()
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--base "$BASE_SHA" --head "$HEAD_SHA")
          fi
          if [[ "$COMPLETE" == true ]]; then args+=(--complete); fi
          if [[ "$LEGACY_CHECKS" == true ]]; then args+=(--migration); fi
          python3 tools/ci/route.py "${args[@]}" --output "$RUNNER_TEMP/selection.json"
          cat "$RUNNER_TEMP/selection.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CI artifact
        id: artifact-upload
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ci-selection
          path: ${{ runner.temp }}/selection.json
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - name: Retry artifact upload once
        id: artifact-retry
        if: ${{ !cancelled() && steps.artifact-upload.outcome == 'failure' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ci-selection-retry
          path: ${{ runner.temp }}/selection.json
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - name: Require successful artifact upload
        if: ${{ !cancelled() }}
        env:
          FIRST: ${{ steps.artifact-upload.outcome }}
          RETRY: ${{ steps.artifact-retry.outcome }}
        run: test "$FIRST" = success || test "$RETRY" = success

  repository:
    name: Repository and CI policy contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check --retries 1 --timeout 20 -r tools/ci/requirements.txt
      - run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Verify source boundaries and tracked artifacts
        run: python3 tools/ci/check_repository.py

  cpp-release:
    name: C++ / release
    needs: route
    if: needs.route.outputs.cpp == 'true'
    uses: ./.github/workflows/ci-cpp.yml
    with:
      configuration: release

  cpp-sanitized:
    name: C++ / sanitized
    needs: route
    if: needs.route.outputs.cpp == 'true'
    uses: ./.github/workflows/ci-cpp.yml
    with:
      configuration: sanitized

  matlab:
    name: MATLAB / ${{ matrix.release }} / batch ${{ matrix.shard }}
    needs: [route, cpp-release]
    if: ${{ always() && needs.route.result == 'success' && (needs.cpp-release.result == 'success' || needs.route.outputs.cpp == 'false') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.matlab_matrix) }}
    uses: ./.github/workflows/ci-matlab.yml
    with:
      selection-id: ${{ needs.route.outputs.selection_id }}
      binary-id: ${{ needs.cpp-release.outputs.artifact-id }}
      release: ${{ matrix.release }}
      configuration: release
      shard: ${{ matrix.shard }}
      binaries: ${{ needs.route.outputs.cpp == 'true' }}
      render: ${{ needs.route.outputs.documentation == 'true' && matrix.release == 'R2025b' && matrix.shard == 0 }}

  matlab-sanitized:
    name: MATLAB / sanitized probes / batch ${{ matrix.shard }}
    needs: [route, cpp-sanitized]
    if: ${{ needs.route.outputs.cpp == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.sanitized_matrix) }}
    uses: ./.github/workflows/ci-matlab.yml
    with:
      selection-id: ${{ needs.route.outputs.selection_id }}
      binary-id: ${{ needs.cpp-sanitized.outputs.artifact-id }}
      release: R2025b
      configuration: sanitized
      shard: ${{ matrix.shard }}
      binaries: true
      render: false

  packages:
    name: Isolated package verification
    needs: route
    if: needs.route.outputs.packaging == 'true'
    uses: ./.github/workflows/release-verification.yml

  required-gate:
    name: Required / WaveVortexModel
    needs: [route, repository, cpp-release, cpp-sanitized, matlab, matlab-sanitized, packages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.route.outputs.selection_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/gate
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-matlab-*
          path: ${{ runner.temp }}/reports
      - name: Require all selected work and evidence
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"jobs.json").write_text(os.environ["JOB_RESULTS"])'
          python3 tools/ci/gate.py --selection "$RUNNER_TEMP/gate/selection.json" --jobs "$RUNNER_TEMP/jobs.json" --reports "$RUNNER_TEMP/reports"

  # Migration bridge: these phases really execute in the shared R2025b job.
  # Turn off WVM_CI_LEGACY_REQUIRED_CHECKS only after the aggregate is proven
  # and branch protection has switched to Required / WaveVortexModel.
  legacy-smoke:
    name: Smoke / MATLAB R2025b
    needs: [route, required-gate]
    if: ${{ always() && needs.route.outputs.migration == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.required-gate.result }}
        run: test "$RESULT" = success
  legacy-documentation:
    name: Documentation / MATLAB R2025b
    needs: [route, required-gate]
    if: ${{ always() && needs.route.outputs.migration == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.required-gate.result }}
        run: test "$RESULT" = success
  legacy-analyzer:
    name: Code Analyzer / MATLAB R2025b
    needs: [route, required-gate]
    if: ${{ always() && needs.route.outputs.migration == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.required-gate.result }}
        run: test "$RESULT" = success
