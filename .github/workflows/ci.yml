name: WaveVortexModel CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'closed' && (github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'final-integration')) && 'retain-final' || 'active' }}
  cancel-in-progress: true

env:
  OCEANKIT_COMMIT: 96f0b801c565406dd5a4ba2480334a3a481c3e2c

jobs:
  kernel-contract:
    if: ${{ github.event.action != 'closed' }}
    name: Portable C++ kernel contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Install NetCDF C development library
        run: sudo apt-get update && sudo apt-get install --yes libnetcdf-dev pkg-config

      - name: Build and test without MATLAB headers
        working-directory: source
        run: tools/compiled-kernel/run_contract_tests.sh

      - name: Build and test portable checkpoint contracts
        working-directory: source
        run: |
          cmake -S PortableRuntime -B "$RUNNER_TEMP/wave-vortex-portable-runtime" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/wave-vortex-portable-runtime" --parallel
          ctest --test-dir "$RUNNER_TEMP/wave-vortex-portable-runtime" --output-on-failure

      - name: Reject forbidden core dependencies and tracked build products
        working-directory: source
        run: |
          if grep -R -nE '#include[[:space:]]*[<"](mex|matrix|matlab|fftw|netcdf)' CompiledKernel/include CompiledKernel/src; then
            echo "Portable kernel source contains a forbidden dependency."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(\.compiled-backend-cache|build)/|\.mex[a-z0-9]*$|\.a$|\.o$|\.dylib$|fftw-3\.3\.11\.tar\.gz$'; then
            echo "A generated native build product is tracked."
            exit 1
          fi

  focused-matlab:
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref != 'main' && !contains(github.event.pull_request.labels.*.name, 'final-integration') }}
    name: Focused MATLAB / R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned OceanKit packages
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: ${{ env.OCEANKIT_COMMIT }}
          path: OceanKit
          persist-credentials: false

      - name: Select focused MATLAB checks
        id: focused-checks
        shell: bash
        working-directory: source
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files=$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
          printf '%s\n' "$changed_files"

          run_analyzer=false
          if grep -Eq '(^|/)[^/]+\.m$' <<< "$changed_files"; then
            run_analyzer=true
          fi

          run_documentation=false
          if grep -Eq '^(Documentation/|docs/|\.github/workflows/ci\.yml$|tools/(build_website_documentation|check_website_documentation|compareDocumentationTrees|documentationRepositoryRoot|generateWebsiteDocumentation|replaceDocumentationTree|validateRenderedWebsite|validateWebsiteDocumentation)\.m$)' <<< "$changed_files"; then
            run_documentation=true
          fi

          echo "run_analyzer=$run_analyzer" >> "$GITHUB_OUTPUT"
          echo "run_documentation=$run_documentation" >> "$GITHUB_OUTPUT"
          {
            echo "### Focused MATLAB selection"
            echo
            echo "- Smoke and compatibility: required"
            echo "- Code Analyzer: $run_analyzer"
            echo "- Documentation source check: $run_documentation"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start MATLAB setup timer
        shell: bash
        run: echo "WVM_SETUP_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up MATLAB R2025b
        id: setup-matlab
        timeout-minutes: 10
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Report MATLAB setup timing
        if: ${{ always() }}
        shell: bash
        run: |
          elapsed_seconds=$(( $(date +%s) - WVM_SETUP_STARTED_AT ))
          {
            echo "### MATLAB provisioning"
            echo
            echo "- Duration: ${elapsed_seconds} seconds"
            echo "- Outcome: ${{ steps.setup-matlab.outcome }}"
            echo "- Cache: enabled; setup-matlab exposes cache restore/populate details only in its step log"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.setup-matlab.outcome }}" != "success" ]]; then
            echo "::error title=MATLAB provisioning incident::Focused CI did not reach test execution within the ten-minute setup budget."
          fi

      - name: Start MATLAB execution timer
        if: ${{ steps.setup-matlab.outcome == 'success' }}
        shell: bash
        run: echo "WVM_MATLAB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run focused MATLAB gate
        if: ${{ steps.setup-matlab.outcome == 'success' }}
        id: matlab-gate
        uses: matlab-actions/run-command@v3
        env:
          WVM_RUN_ANALYZER: ${{ steps.focused-checks.outputs.run_analyzer }}
          WVM_RUN_DOCUMENTATION: ${{ steps.focused-checks.outputs.run_documentation }}
          WVM_DOCUMENTATION_DIAGNOSTIC_FOLDER: ${{ runner.temp }}/wave-vortex-model-generated-docs
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            oceanKitRoot = fullfile(pwd,"OceanKit");
            mpmAddRepository("OceanKit",oceanKitRoot);
            addpath(fullfile(sourceRoot,"tools"));
            if string(getenv("WVM_RUN_DOCUMENTATION")) == "true", configureCIEnvironment(sourceRoot,oceanKitRoot,documentationPackageSpecifier="ClassDocumentation@1.3.2"); else, configureCIEnvironment(sourceRoot,oceanKitRoot); end
            cd(sourceRoot);
            tasks = "test:smoke";
            if string(getenv("WVM_RUN_ANALYZER")) == "true", tasks(end+1) = "analyze"; end
            if string(getenv("WVM_RUN_DOCUMENTATION")) == "true", tasks(end+1) = "docs:check"; end
            fprintf("Focused MATLAB tasks: %s\n",strjoin(tasks,", "));
            taskArguments = cellstr(tasks);
            buildtool(taskArguments{:})

      - name: Report MATLAB execution timing
        if: ${{ always() && env.WVM_MATLAB_STARTED_AT != '' }}
        shell: bash
        run: |
          elapsed_seconds=$(( $(date +%s) - WVM_MATLAB_STARTED_AT ))
          {
            echo "### MATLAB execution"
            echo
            echo "- Duration: ${elapsed_seconds} seconds"
            echo "- Outcome: ${{ steps.matlab-gate.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated documentation diagnostics
        if: ${{ failure() && steps.focused-checks.outputs.run_documentation == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: focused-generated-documentation
          path: ${{ runner.temp }}/wave-vortex-model-generated-docs
          if-no-files-found: ignore

      - name: Verify clean source checkout
        if: ${{ always() }}
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh

  smoke:
    if: ${{ github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'final-integration')) }}
    name: Smoke / MATLAB R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out pinned OceanKit packages
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: ${{ env.OCEANKIT_COMMIT }}
          path: OceanKit
          persist-credentials: false

      - name: Set up MATLAB R2025b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Run smoke tests
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            oceanKitRoot = fullfile(pwd,"OceanKit");
            mpmAddRepository("OceanKit",oceanKitRoot);
            addpath(fullfile(sourceRoot,"tools"));
            configureCIEnvironment(sourceRoot,oceanKitRoot);
            cd(sourceRoot);
            buildtool test:smoke

      - name: Verify clean source checkout
        if: ${{ always() }}
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh

  documentation:
    if: ${{ github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'final-integration')) }}
    name: Documentation / MATLAB R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out pinned OceanKit packages
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: ${{ env.OCEANKIT_COMMIT }}
          path: OceanKit
          persist-credentials: false

      - name: Set up MATLAB R2025b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Verify committed documentation
        uses: matlab-actions/run-command@v3
        env:
          WVM_DOCUMENTATION_DIAGNOSTIC_FOLDER: ${{ runner.temp }}/wave-vortex-model-generated-docs
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            oceanKitRoot = fullfile(pwd,"OceanKit");
            mpmAddRepository("OceanKit",oceanKitRoot);
            addpath(fullfile(sourceRoot,"tools"));
            configureCIEnvironment(sourceRoot,oceanKitRoot,documentationPackageSpecifier="ClassDocumentation@1.3.2");
            cd(sourceRoot);
            buildtool docs:check

      - name: Build rendered website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./source/docs
          destination: ./rendered-site

      - name: Verify rendered website
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(fullfile(pwd,"source","tools"));
            validateRenderedWebsite(fullfile(pwd,"rendered-site"))

      - name: Upload generated documentation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: r2025b-generated-documentation
          path: ${{ runner.temp }}/wave-vortex-model-generated-docs
          if-no-files-found: ignore

      - name: Upload rendered website diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: r2025b-rendered-website
          path: rendered-site
          if-no-files-found: ignore

      - name: Verify clean source checkout
        if: ${{ always() }}
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh

  analyzer:
    if: ${{ github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'final-integration')) }}
    name: Code Analyzer / MATLAB R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out pinned OceanKit packages
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: ${{ env.OCEANKIT_COMMIT }}
          path: OceanKit
          persist-credentials: false

      - name: Set up MATLAB R2025b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Run Code Analyzer
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            oceanKitRoot = fullfile(pwd,"OceanKit");
            mpmAddRepository("OceanKit",oceanKitRoot);
            addpath(fullfile(sourceRoot,"tools"));
            configureCIEnvironment(sourceRoot,oceanKitRoot);
            cd(sourceRoot);
            buildtool analyze

      - name: Verify clean source checkout
        if: ${{ always() }}
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh

  required-gate:
    if: ${{ always() && github.event.action != 'closed' }}
    name: Required / WaveVortexModel
    needs: [kernel-contract, focused-matlab, smoke, documentation, analyzer]
    runs-on: ubuntu-latest
    env:
      WVM_GATE_MODE: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && !contains(github.event.pull_request.labels.*.name, 'final-integration') && 'focused' || 'full' }}
      KERNEL_RESULT: ${{ needs.kernel-contract.result }}
      FOCUSED_RESULT: ${{ needs.focused-matlab.result }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
      ANALYZER_RESULT: ${{ needs.analyzer.result }}
    steps:
      - name: Enforce the selected required gate
        shell: bash
        run: |
          echo "Gate mode: $WVM_GATE_MODE"
          echo "kernel=$KERNEL_RESULT focused=$FOCUSED_RESULT smoke=$SMOKE_RESULT documentation=$DOCUMENTATION_RESULT analyzer=$ANALYZER_RESULT"
          test "$KERNEL_RESULT" = success
          if [[ "$WVM_GATE_MODE" = focused ]]; then
            test "$FOCUSED_RESULT" = success
            test "$SMOKE_RESULT" = skipped
            test "$DOCUMENTATION_RESULT" = skipped
            test "$ANALYZER_RESULT" = skipped
          else
            test "$FOCUSED_RESULT" = skipped
            test "$SMOKE_RESULT" = success
            test "$DOCUMENTATION_RESULT" = success
            test "$ANALYZER_RESULT" = success
          fi
