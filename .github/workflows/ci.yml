name: WaveVortexModel CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  OCEANKIT_COMMIT: 0f2dae987eb777dd54a15f9b910ddb7f221b5852

jobs:
  changes:
    name: Repository policy and CI routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matlab: ${{ steps.select.outputs.matlab }}
      cpp: ${{ steps.select.outputs.cpp }}
      documentation: ${{ steps.select.outputs.documentation }}
      package: ${{ steps.select.outputs.package }}
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test repository artifact policy and routing contracts
        run: |
          python3 -m unittest discover -s tools -p 'test_checkRepositoryArtifacts.py'
          python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Check artifact policy, removed references and changed files
        id: select
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          head="${PR_HEAD_SHA:-$GITHUB_SHA}"
          if [ -n "$PR_BASE_SHA" ]; then
            base=$(git merge-base "$PR_BASE_SHA" "$head")
          elif [ -n "$PUSH_BASE_SHA" ] && [ "$PUSH_BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            base="$PUSH_BASE_SHA"
          else
            base=$(git rev-parse "$head^")
          fi
          python3 tools/checkRepositoryArtifacts.py --base "$base"
          python3 tools/ci/classify_changes.py --base "$base" --head "$head" --plan "$RUNNER_TEMP/ci-plan.json"

      - name: Save the selected MATLAB checks
        if: steps.select.outputs.matlab == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan.json
          retention-days: 7

  kernel-contract:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    name: Portable C++ kernel contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Install NetCDF C development library
        run: |
          for source_file in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=20 install --yes libnetcdf-dev pkg-config

      - name: Build and test without MATLAB headers
        working-directory: source
        run: tools/compiled-kernel/run_contract_tests.sh

      - name: Build and test portable checkpoint contracts
        working-directory: source
        run: |
          cmake -S PortableRuntime -B "$RUNNER_TEMP/wave-vortex-portable-runtime" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/wave-vortex-portable-runtime" --parallel
          ctest --test-dir "$RUNNER_TEMP/wave-vortex-portable-runtime" --output-on-failure

      - name: Reject forbidden core dependencies
        working-directory: source
        run: |
          if grep -R -nE '#include[[:space:]]*[<"](mex|matrix|matlab|fftw|netcdf)' CompiledKernel/include CompiledKernel/src; then
            echo "Portable kernel source contains a forbidden dependency."
            exit 1
          fi

  portable-runtime-sanitizers:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    name: Portable C++ ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Install NetCDF C development library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnetcdf-dev pkg-config

      - name: Build the portable runtime with Clang sanitizers
        working-directory: source
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S PortableRuntime -B "$RUNNER_TEMP/wave-vortex-portable-runtime-sanitized" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build "$RUNNER_TEMP/wave-vortex-portable-runtime-sanitized" --parallel

      - name: Run the sanitized portable-runtime contracts
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir "$RUNNER_TEMP/wave-vortex-portable-runtime-sanitized" --output-on-failure

  focused-matlab:
    needs: changes
    if: needs.changes.outputs.matlab == 'true'
    name: Focused MATLAB / R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out pinned OceanKit packages
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: ${{ env.OCEANKIT_COMMIT }}
          path: OceanKit
          persist-credentials: false

      - name: Load the selected checks
        uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}

      - name: Set up MATLAB R2025b
        timeout-minutes: 10
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Run smoke and affected scientific regressions
        uses: matlab-actions/run-command@v3
        env:
          WVM_CI_PLAN: ${{ runner.temp }}/ci-plan.json
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            oceanKitRoot = fullfile(pwd,"OceanKit");
            mpmAddRepository("OceanKit",oceanKitRoot);
            addpath(fullfile(sourceRoot,"tools"));
            configureCIEnvironment(sourceRoot,oceanKitRoot);
            cd(sourceRoot);
            buildtool test:smoke;
            selection = jsondecode(fileread(getenv("WVM_CI_PLAN")));
            for testName = reshape(string(selection.tests),1,[]),
                parts = split(testName,"/");
                suite = testsuite(fullfile(sourceRoot,"UnitTests",parts(1)+".m"));
                suite = suite.selectIf(matlab.unittest.selectors.HasTag("smoke") | matlab.unittest.selectors.HasTag("full"));
                if numel(parts) == 2, suite = suite(string({suite.ProcedureName}) == parts(2)); end;
                assert(~isempty(suite),"Selected CI regression did not discover any eligible tests: %s",testName);
                fprintf("Affected scientific regression: %s (%d tests)\n",testName,numel(suite));
                results = run(suite);
                assertSuccess(results);
            end;
            files = reshape(string(selection.analyzer_files),[],1);
            if ~isempty(files), analyzeProductionCode(sourceRoot,Files=fullfile(sourceRoot,files)); end

      - name: Verify clean source checkout
        if: always()
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh

  documentation:
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    name: Documentation / MATLAB R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out pinned OceanKit packages
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: ${{ env.OCEANKIT_COMMIT }}
          path: OceanKit
          persist-credentials: false

      - name: Set up MATLAB R2025b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Verify committed documentation
        uses: matlab-actions/run-command@v3
        env:
          WVM_DOCUMENTATION_DIAGNOSTIC_FOLDER: ${{ runner.temp }}/wave-vortex-model-generated-docs
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            oceanKitRoot = fullfile(pwd,"OceanKit");
            mpmAddRepository("OceanKit",oceanKitRoot);
            addpath(fullfile(sourceRoot,"tools"));
            configureCIEnvironment(sourceRoot,oceanKitRoot,documentationPackageSpecifier="ClassDocumentation@1.3.2");
            cd(sourceRoot);
            buildtool docs:check

      - name: Upload generated documentation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: r2025b-generated-documentation
          path: ${{ runner.temp }}/wave-vortex-model-generated-docs
          if-no-files-found: ignore

      - name: Verify clean source checkout
        if: ${{ always() }}
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh

  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/release-verification.yml

  required-gate:
    if: always()
    name: Required / WaveVortexModel
    needs: [changes, kernel-contract, portable-runtime-sanitizers, focused-matlab, documentation, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out gate policy
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require every selected check to succeed
        env:
          WVM_CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/check_required_gate.py
