name: Stratified QG qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqg-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: SQG qualification / ${{ matrix.configuration }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        configuration: [release, sanitized]
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: 96f0b801c565406dd5a4ba2480334a3a481c3e2c
          path: OceanKit
          persist-credentials: false
      - name: Install NetCDF
        timeout-minutes: 5
        run: |
          bash source/tools/ci/provision_ubuntu.sh netcdf
      - name: Build reference runtime and probes
        working-directory: source
        env:
          CC: clang
          CXX: clang++
        run: |
          flags=()
          if [[ '${{ matrix.configuration }}' == sanitized ]]; then
            flags+=('-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined')
          fi
          cmake -S PortableRuntime -B "$RUNNER_TEMP/sqg-build" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWV_ENABLE_ACCELERATE=OFF "${flags[@]}"
          cmake --build "$RUNNER_TEMP/sqg-build" --parallel 4 --target wave-vortex-run WVStableForcingDump WVStratifiedQGFieldDump WVStratifiedQGLifecycleProbe WVStratifiedModalDump
      - name: Configure bounded provisioning
        timeout-minutes: 5
        run: bash source/tools/ci/provision_ubuntu.sh matlab
      - name: Provision MATLAB
        id: setup
        continue-on-error: true
        timeout-minutes: 5
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true
      - name: Retry MATLAB provisioning once
        id: retry
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        timeout-minutes: 5
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true
      - name: Require successful provisioning
        env:
          FIRST: ${{ steps.setup.outcome }}
          RETRY: ${{ steps.retry.outcome }}
        run: test "$FIRST" = success || test "$RETRY" = success
      - name: Qualify MATLAB-C++-MATLAB continuation
        uses: matlab-actions/run-command@v3
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        with:
          command: >-
            sourceRoot=fullfile(pwd,"source");
            addpath(fullfile(sourceRoot,"tools"));
            configureCIEnvironment(sourceRoot,fullfile(pwd,"OceanKit"));
            cd(sourceRoot);
            qualifyPortableStratifiedQG(fullfile(getenv("RUNNER_TEMP"),"sqg-qualification.json"),runner=fullfile(getenv("RUNNER_TEMP"),"sqg-build","wave-vortex-run"));
      - name: Upload machine-readable qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqg-qualification-${{ matrix.configuration }}
          path: ${{ runner.temp }}/sqg-qualification.json
          if-no-files-found: error
      - name: Verify clean checkout
        if: always()
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh
