name: WaveVortexModel Extended CI

on:
  schedule:
    - cron: "0 9 * * 1"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'closed' && (github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'final-integration')) && 'retain-final' || 'active' }}
  cancel-in-progress: true

env:
  OCEANKIT_COMMIT: 96f0b801c565406dd5a4ba2480334a3a481c3e2c

jobs:
  full:
    if: ${{ github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'final-integration')) }}
    name: Full / MATLAB R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install portable-runtime build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libnetcdf-dev pkg-config

      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out pinned OceanKit packages
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: ${{ env.OCEANKIT_COMMIT }}
          path: OceanKit
          persist-credentials: false

      - name: Set up MATLAB R2025b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Run full tests
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            oceanKitRoot = fullfile(pwd,"OceanKit");
            mpmAddRepository("OceanKit",oceanKitRoot);
            addpath(fullfile(sourceRoot,"tools"));
            configureCIEnvironment(sourceRoot,oceanKitRoot);
            cd(sourceRoot);
            buildtool test:full

      - name: Verify clean source checkout
        if: always()
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh

  exhaustive:
    if: ${{ github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'final-integration')) }}
    name: Exhaustive / MATLAB R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out pinned OceanKit packages
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: ${{ env.OCEANKIT_COMMIT }}
          path: OceanKit
          persist-credentials: false

      - name: Set up MATLAB R2025b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Run exhaustive tests
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            oceanKitRoot = fullfile(pwd,"OceanKit");
            mpmAddRepository("OceanKit",oceanKitRoot);
            addpath(fullfile(sourceRoot,"tools"));
            configureCIEnvironment(sourceRoot,oceanKitRoot);
            cd(sourceRoot);
            buildtool test:exhaustive

      - name: Verify clean source checkout
        if: always()
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh

  optional:
    if: ${{ github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'final-integration')) }}
    name: Optional / MATLAB R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out pinned OceanKit packages
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: ${{ env.OCEANKIT_COMMIT }}
          path: OceanKit
          persist-credentials: false

      - name: Set up MATLAB R2025b with Optimization Toolbox
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Optimization_Toolbox
          cache: true

      - name: Run optional tests when Optimization Toolbox is available
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            oceanKitRoot = fullfile(pwd,"OceanKit");
            mpmAddRepository("OceanKit",oceanKitRoot);
            addpath(fullfile(sourceRoot,"tools"));
            configureCIEnvironment(sourceRoot,oceanKitRoot);
            cd(sourceRoot);
            if WVNoMotionProfileOperation.hasOptimizationToolboxSupport()
                buildtool test:optional;
            else
                message = "Optimization Toolbox is unavailable; optional tests were skipped intentionally.";
                fprintf("::notice title=Optional tests skipped::%s\n",message);
                summaryPath = getenv("GITHUB_STEP_SUMMARY");
                summaryFile = fopen(summaryPath,"a");
                assert(summaryFile >= 0,"Unable to open the GitHub step summary.");
                summaryCleanup = onCleanup(@()fclose(summaryFile));
                fprintf(summaryFile,"### Optional tests\n\n%s\n",message);
                clear summaryCleanup
            end

      - name: Verify clean source checkout
        if: always()
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh
