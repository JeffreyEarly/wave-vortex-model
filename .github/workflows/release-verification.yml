name: WaveVortexModel Package Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "*.m"
      - "@*/**"
      - "FlowComponents/**"
      - "Forcing/**"
      - "ArgumentValidationFunctions/**"
      - "FastTransforms/**"
      - "Integrators/**"
      - "ObservingSystems/**"
      - "Operations/**"
      - "CompiledKernel/**"
      - "PortableRuntime/**"
      - "Documentation/**"
      - "docs/**"
      - "tools/**"
      - "resources/mpackage.json"
      - "CHANGELOG.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/extended-ci.yml"
      - ".github/workflows/release-mpm.yml"
      - ".github/workflows/release-verification.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OCEANKIT_COMMIT: 96f0b801c565406dd5a4ba2480334a3a481c3e2c

jobs:
  clean-install:
    name: Clean install / MATLAB R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out immutable OceanKit packages
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: ${{ env.OCEANKIT_COMMIT }}
          path: OceanKit
          persist-credentials: false

      - name: Set up MATLAB R2025b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Create isolated MATLAB preferences
        run: mkdir -p "${{ runner.temp }}/matlab-preferences-clean-install"

      - name: Install and verify the authoring package
        uses: matlab-actions/run-command@v3
        env:
          MATLAB_PREFDIR: ${{ runner.temp }}/matlab-preferences-clean-install
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            oceanKitRoot = fullfile(pwd,"OceanKit");
            addpath(fullfile(sourceRoot,"tools"));
            verifyWaveVortexModelPackage(sourceRoot,oceanKitRoot)

      - name: Verify clean source checkout
        if: always()
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh

  exported-package:
    name: Exported package / MATLAB R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install portable-runtime build dependencies
        run: sudo apt-get update && sudo apt-get install -y libnetcdf-dev pkg-config

      - name: Check out WaveVortexModel
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out immutable OceanKit release tools and packages
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: ${{ env.OCEANKIT_COMMIT }}
          path: OceanKit
          persist-credentials: false

      - name: Set up MATLAB R2025b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Create isolated release workspace
        run: |
          git clone --no-hardlinks source "${{ runner.temp }}/wave-vortex-model-release-candidate"
          git -C "${{ runner.temp }}/wave-vortex-model-release-candidate" checkout --detach "$(git -C source rev-parse HEAD)"
          mkdir -p "${{ runner.temp }}/wave-vortex-model-release-output"
          mkdir -p "${{ runner.temp }}/matlab-preferences-release"
          mkdir -p "${{ runner.temp }}/matlab-preferences-export"

      - name: Prepare unpublished patch export
        uses: matlab-actions/run-command@v3
        env:
          MATLAB_PREFDIR: ${{ runner.temp }}/matlab-preferences-release
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            candidateRoot = "${{ runner.temp }}/wave-vortex-model-release-candidate";
            oceanKitRoot = fullfile(pwd,"OceanKit");
            outputRoot = "${{ runner.temp }}/wave-vortex-model-release-output";
            addpath(fullfile(sourceRoot,"tools"));
            report = prepareWaveVortexModelReleaseCandidate(candidateRoot,oceanKitRoot,outputRoot);
            save(fullfile(outputRoot,"candidate-report.mat"),"report")

      - name: Install and verify the exported package
        uses: matlab-actions/run-command@v3
        env:
          MATLAB_PREFDIR: ${{ runner.temp }}/matlab-preferences-export
        with:
          command: >-
            sourceRoot = fullfile(pwd,"source");
            oceanKitRoot = fullfile(pwd,"OceanKit");
            outputRoot = "${{ runner.temp }}/wave-vortex-model-release-output";
            candidate = load(fullfile(outputRoot,"candidate-report.mat"),"report");
            addpath(fullfile(sourceRoot,"tools"));
            verifyWaveVortexModelPackage(candidate.report.exportPath,oceanKitRoot,expectedVersion=candidate.report.version)

      - name: Build and inspect the exported reference runtime
        shell: bash
        run: |
          export_path=$(find "${{ runner.temp }}/wave-vortex-model-release-output" -maxdepth 1 -type d -name 'WaveVortexModel-*' -print -quit)
          test -n "$export_path"
          cmake -S "$export_path/PortableRuntime" -B "${{ runner.temp }}/wave-vortex-runtime-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "${{ runner.temp }}/wave-vortex-runtime-build" --parallel --target wave-vortex-run
          set +e
          output=$("${{ runner.temp }}/wave-vortex-runtime-build/wave-vortex-run" 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          python3 -c 'import json,sys; report=json.loads(sys.stdin.read()); assert report["status"] == "failed"' <<< "$output"

      - name: Upload release-candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wave-vortex-model-release-candidate
          path: ${{ runner.temp }}/wave-vortex-model-release-output
          if-no-files-found: ignore

      - name: Verify clean source checkout
        if: always()
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh
