name: Shared C++ build and contracts
on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install bounded build dependencies
        timeout-minutes: 5
        run: bash tools/ci/provision_ubuntu.sh netcdf
      - name: Build shared core and runtime once
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          flags=()
          build_type=Release
          if [[ "$CONFIGURATION" == sanitized ]]; then
            export CC=clang CXX=clang++
            build_type=RelWithDebInfo
            flags+=('-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined')
          fi
          cmake -S tools/ci -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE="$build_type" -DWV_ENABLE_ACCELERATE=OFF "${flags[@]}"
          cmake --build "$RUNNER_TEMP/build" --parallel 4
      - name: Run all core and runtime contracts
        env:
          ASAN_OPTIONS: detect_leaks=1:alloc_dealloc_mismatch=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir "$RUNNER_TEMP/build" --output-on-failure
      - name: Package exact-revision probes
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: python3 tools/ci/artifacts.py pack --build "$RUNNER_TEMP/build" --directory "$RUNNER_TEMP/binaries" --configuration "$CONFIGURATION"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-binaries-${{ inputs.configuration }}
          path: ${{ runner.temp }}/binaries
          overwrite: true
          retention-days: 7
