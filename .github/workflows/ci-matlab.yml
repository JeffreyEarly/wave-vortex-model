name: Shared MATLAB validation
on:
  workflow_call:
    inputs:
      selection-id:
        required: true
        type: string
      binary-id:
        required: false
        type: string
      release:
        required: true
        type: string
      configuration:
        required: true
        type: string
      shard:
        required: true
        type: number
      binaries:
        required: true
        type: boolean
      render:
        required: true
        type: boolean
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: 96f0b801c565406dd5a4ba2480334a3a481c3e2c
          path: OceanKit
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.selection-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/selection
      - name: Configure bounded Ubuntu package downloads
        timeout-minutes: 5
        run: bash source/tools/ci/provision_ubuntu.sh ${{ inputs.binaries && 'netcdf' || 'matlab' }}
      - name: Provision MATLAB
        id: setup
        continue-on-error: true
        timeout-minutes: 5
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ inputs.release }}
          cache: true
      - name: Retry MATLAB provisioning once
        id: retry
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        timeout-minutes: 5
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ inputs.release }}
          cache: true
      - name: Require successful provisioning
        env:
          FIRST: ${{ steps.setup.outcome }}
          RETRY: ${{ steps.retry.outcome }}
        run: test "$FIRST" = success || test "$RETRY" = success
      - uses: actions/download-artifact@v4
        if: inputs.binaries
        with:
          artifact-ids: ${{ inputs.binary-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/binaries
      - name: Verify exact-revision binary artifact
        if: inputs.binaries
        working-directory: source
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: python3 tools/ci/artifacts.py verify --directory "$RUNNER_TEMP/binaries" --configuration "$CONFIGURATION"
      - name: Run selected MATLAB phases and numerical tests
        uses: matlab-actions/run-command@v3
        env:
          ASAN_OPTIONS: detect_leaks=1:alloc_dealloc_mismatch=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          WVM_CI_SHARD: ${{ inputs.shard }}
          WVM_CI_CONFIGURATION: ${{ inputs.configuration }}
          WVM_CI_HAS_BINARIES: ${{ inputs.binaries }}
          WVM_DOCUMENTATION_DIAGNOSTIC_FOLDER: ${{ runner.temp }}/generated-docs
        with:
          command: >-
            root=fullfile(pwd,"source");
            addpath(fullfile(root,"tools"));
            configureCIEnvironment(root,fullfile(pwd,"OceanKit"),documentationPackageSpecifier="ClassDocumentation@1.3.2");
            cd(root);
            binaries="";
            if getenv("WVM_CI_HAS_BINARIES")=="true", binaries=fullfile(getenv("RUNNER_TEMP"),"binaries"); end;
            runFocusedCI(fullfile(getenv("RUNNER_TEMP"),"selection","selection.json"),binaries,fullfile(getenv("RUNNER_TEMP"),"matlab-results.json"),getenv("WVM_CI_CONFIGURATION"),str2double(getenv("WVM_CI_SHARD")));
      - name: Build rendered website
        if: inputs.render
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./source/docs
          destination: ./rendered-site
      - name: Verify rendered website
        if: inputs.render
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"source","tools")); validateRenderedWebsite(fullfile(pwd,"rendered-site"));
      - name: Verify clean source checkout
        if: always()
        working-directory: source
        run: bash tools/checkCIWorkspaceCleanliness.sh
      - name: Upload CI artifact
        id: artifact-upload
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ci-matlab-${{ inputs.release }}-${{ inputs.configuration }}-${{ inputs.shard }}
          path: ${{ runner.temp }}/matlab-results.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Retry artifact upload once
        id: artifact-retry
        if: ${{ !cancelled() && steps.artifact-upload.outcome == 'failure' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ci-matlab-${{ inputs.release }}-${{ inputs.configuration }}-${{ inputs.shard }}-retry
          path: ${{ runner.temp }}/matlab-results.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Require successful artifact upload
        if: ${{ !cancelled() }}
        env:
          FIRST: ${{ steps.artifact-upload.outcome }}
          RETRY: ${{ steps.artifact-retry.outcome }}
        run: test "$FIRST" = success || test "$RETRY" = success
