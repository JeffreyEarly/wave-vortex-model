<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaveVortexModel branding preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 24px; color: #122e50; background: #eef3f8; font: 16px/1.5 "Avenir Next", Avenir, sans-serif; }
  main { max-width: 1040px; margin: auto; }
  h1 { margin: 0 0 28px; font-size: 28px; font-weight: 500; }
  h2 { margin: 0 0 20px; font-size: 18px; font-weight: 500; }
  figure { margin: 0; }
  figcaption { margin-top: 10px; font-size: 14px; }
  section { padding: 28px; border-radius: 16px; background: white; margin-bottom: 24px; }
  .icons, .wordmarks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: start; }
  .icons img { width: 100%; max-width: 240px; display: block; }
  .wordmarks { grid-template-columns: 1fr 1fr; }
  .wordmark { padding: 24px; border-radius: 12px; background: #f5f6fa; }
  .wordmark.dark { color: #edf6ff; background: #27262b; }
  .wordmark img { display: block; width: 214.4px; max-width: 100%; height: 40px; object-fit: contain; object-position: left; }
  .favicon-row { display: flex; gap: 32px; align-items: start; flex-wrap: wrap; }
  .favicon-row img { display: block; }
  .sharing { display: block; width: 100%; height: auto; }
  .flow { padding: 24px; border-radius: 12px; background: #041a3d; }
  .flow img { display: block; width: 100%; height: auto; }
  .flow.mono { margin-top: 20px; background: #eef3f8; }
  @media (max-width: 650px) {
    body { padding: 24px 12px; }
    section { padding: 20px; }
    .icons { grid-template-columns: 1fr; }
    .wordmarks { grid-template-columns: 1fr; }
  }
</style>
<main>
  <h1>WaveVortexModel branding</h1>
  <section>
    <h2>Full and small icons</h2>
    <div class="icons">
      <figure><img src="../WebsiteDocumentation/assets/branding/icon-rounded.svg" alt="Full icon with transparent rounded corners"><figcaption>Rounded website icon</figcaption></figure>
      <figure><img src="../WebsiteDocumentation/assets/branding/icon-square.svg" alt="Full icon with an opaque square background"><figcaption>Square shortcut icon</figcaption></figure>
      <figure><img src="../WebsiteDocumentation/assets/branding/icon-small.svg" alt="Simplified coral roll-up between two cyan contours"><figcaption>Simplified small icon</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>Header wordmarks at display size</h2>
    <div class="wordmarks">
      <figure class="wordmark"><img src="../WebsiteDocumentation/assets/branding/logo-horizontal-light.svg" alt="WaveVortexModel"><figcaption>Light background</figcaption></figure>
      <figure class="wordmark dark"><img src="../WebsiteDocumentation/assets/branding/logo-horizontal-dark.svg" alt="WaveVortexModel"><figcaption>Dark background</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>Favicons at native sizes</h2>
    <div class="favicon-row">
      <figure><img width="16" height="16" src="../WebsiteDocumentation/assets/branding/favicon-16.png" alt="16 pixel icon"><figcaption>16 px</figcaption></figure>
      <figure><img width="32" height="32" src="../WebsiteDocumentation/assets/branding/favicon-32.png" alt="32 pixel icon"><figcaption>32 px</figcaption></figure>
      <figure><img width="48" height="48" src="../WebsiteDocumentation/assets/branding/favicon-48.png" alt="48 pixel icon"><figcaption>48 px</figcaption></figure>
      <figure><img width="96" height="96" src="../WebsiteDocumentation/assets/branding/favicon-96.png" alt="96 pixel icon"><figcaption>96 px</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>Link-sharing card</h2>
    <img class="sharing" src="../WebsiteDocumentation/assets/branding/social-card.png" alt="WaveVortexModel, rotating stratified flow, wavevortexmodel.org">
  </section>
  <section>
    <h2>Standalone flow marks</h2>
    <div class="flow"><img src="../WebsiteDocumentation/assets/branding/flow-mark.svg" alt="Colored standalone flow contours"></div>
    <div class="flow mono"><img src="../WebsiteDocumentation/assets/branding/flow-mark-monochrome.svg" alt="Monochrome standalone flow contours"></div>
  </section>
</main>
</html>
